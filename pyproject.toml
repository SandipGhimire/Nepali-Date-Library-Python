[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nepali-date-library"
version = "1.0.1"
description = "Fast, zero-dependency Nepali Date (Bikram Sambat / BS) converter and calendar library for Python. Bidirectional BS to AD / AD to BS conversion, fiscal year, date arithmetic, and Devanagari formatting."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

authors = [{ name = "Sandip Ghimire", email = "sandipghimire2076@gmail.com" }]

keywords = [
    "date-converter",
    "nepali-date-converter",
    "nepali-date",
    "nepali-date-library",
    "bikram-sambat",
    "bikram-sambat-date",
    "bikram-sambat-converter",
    "bs-to-ad",
    "ad-to-bs",
    "bs-date",
    "nepali-calendar",
    "nepali-patro",
    "nepali-miti",
    "nepali-age-calculator",
    "nepali-fiscal-year",
    "aarthik-barsha",
    "nepali",
    "nepal",
    "python-nepali-date",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = []

[project.urls]
Homepage = "https://nepali-pkg.date/docs/python"
Documentation = "https://nepali-pkg.date/docs/python"
Repository = "https://github.com/SandipGhimire/Nepali-Date-Library-Python"
Issues = "https://github.com/SandipGhimire/Nepali-Date-Library-Python/issues"

[dependency-groups]
dev = ["pytest>=7.0", "black", "flake8", "mypy", "build", "twine", "taskipy"]

[tool.taskipy.tasks]
test = "black --check src && flake8 src && pytest"
build = "python -m build"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.mypy]
python_version = "3.9"
strict = true
